# Murphy Swing Screener - persistent settings.
# Anything you omit falls back to the defaults in src/config.py.
# The Streamlit sidebar overrides this file for the current session only.

regime:
  benchmark: SPY
  benchmark_ma: 200        # SPY must be above its 200-day SMA to allow longs
  vix_max: 25.0
  use_vix: true
  breadth_min_pct: 0       # 0 = off. e.g. 50 = half the universe above its SMA200

trend:
  sma_fast: 50
  sma_slow: 200
  sma200_slope_lookback: 20
  min_sma200_slope_pct: 0.0
  high_52w_lookback: 252
  min_pct_of_52w_high: 80.0

entry_zone:
  max_pct_below_sma50: 2.0   # pullback tolerance
  max_pct_above_sma50: 5.0   # risk-reward capping

volume:
  avg_length: 50
  surge_multiple: 1.5
  surge_lookback_days: 3

liquidity:
  min_price: 5.0        # matches the Finviz pre-filter (sh_price:o5)
  min_adv_shares: 500000
  min_dollar_volume: 0

relative_strength:
  lookback_days: 60
  min_excess_return_pct: 0.0

squeeze:
  short_atr: 10
  long_atr: 50
  max_ratio: 1.0

ownership:
  min_institutional_pct: 10.0
  on_missing: warn         # pass | fail | warn

sector:
  enabled: true
  min_rsi: 50.0
  rsi_length: 14
  rs_lookback_days: 60
  mode: rsi_or_rs          # rsi_or_rs | rsi_only | rs_only
  on_missing: warn

earnings:
  enabled: true
  blackout_days: 7
  on_missing: warn

exits:
  initial_stop_atr_multiple: 2.0
  atr_length: 14
  swing_low_lookback: 20
  trail_atr_multiple: 2.0
  tier1_gain_pct: 10.0
  tier2_gain_pct: 20.0
  tier3_gain_pct: 25.0
  tier3_sell_fraction: 0.5
  tier2_trail_atr_multiple: 1.5

risk:
  account_size: 100000
  risk_per_trade_pct: 1.0
  max_position_pct: 20.0

scan:
  history_period: 3y
  min_bars: 260
  fetch_fundamentals: true
  score_weights:
    relative_strength: 30
    volume_surge: 20
    proximity_52w_high: 20
    squeeze: 15
    sector: 15
